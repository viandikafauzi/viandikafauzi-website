events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  server_tokens off;

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;
    location = /404.html {
      internal;
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
